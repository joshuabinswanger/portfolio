# Story page: title + short description, then a scrollytelling sequence
# (cards slide over a pinned image), then the facts and links at the end.
# Chapter text is drafted from the image captions in src/content/images —
# edit freely. Block types and fields: docs/stories.md.

project: StructureOfWood
title: Structure of Wood
subtitle: Visualisations & 3D Prints
summary: >-
  Stability, lightness and durability make wood a natural miracle material.
  These illustrations look inside it, scale by scale, to show where those
  properties come from.

# Facts, shown at the end in this order.
year: "2019"
context: BA Diploma
client: ETH Zürich, Wood Materials Science
role: "Illustration"
tools: ZBrush, Keyshot, Adobe Suite
collaborators: ETH Wood Materials Science Group
# links:
#   - label: Publication
#     url: https://example.org
draft: false

blocks:
  - type: scrolly
    steps:
      - image:
          src: /src/assets/projects/structureofwood/StructureofWood_Gallery_6_buzkrx.webp
          alt: Wood cell structures at their real sizes, from the year ring down to the cellulose molecule
        heading: From year ring to molecule
        body: |
          Every property of wood comes from a structure, and every structure
          sits inside a larger one. The series follows them down through the
          scales, each shown at its real size.

      - image:
          src: /src/assets/projects/structureofwood/StructureofWood_Gallery_1_ytvxjm.webp
          alt: Softwood cell structure with year ring, bordered pits and parenchyma cells
        heading: Softwood cells · 300 µm
        body: |
          Fibre cells cut across a year ring. Bordered pits connect
          neighbouring cells, and parenchyma cells run between them.
        position: right

      - image:
          src: /src/assets/projects/structureofwood/StructureofWood_Gallery_2_rgmaqy.webp
          alt: Close-up of bordered pits showing the margo
        heading: Bordered pits
        body: |
          Closer in, the bordered pits show the margo, the porous membrane
          water passes through on its way from cell to cell.

      - image:
          src: /src/assets/projects/structureofwood/StructureofWood_Gallery_3_s5mqz0.webp
          alt: Simplified softwood fibre cell wall with its layers of fibres at different angles
        heading: The cell wall · 30 µm
        body: |
          A simplified fibre cell wall. Its layers wind the fibres at
          different angles, and that layering is what makes the wall strong.
        position: right

      - image:
          src: /src/assets/projects/structureofwood/StructureofWood_Gallery_4_llpwgf.webp
          alt: Abstract arrangement of cellulose and lignin molecules in a microfibril
        heading: Cellulose microfibril · 15 nm
        body: |
          A possible arrangement of cellulose (blue) and lignin (pink)
          molecules.

      - image:
          src: /src/assets/projects/structureofwood/StructureofWood_Gallery_5_g1x7ry.webp
          alt: Close-up of lignin fibrils wrapping around cellulose fibrils
        heading: Like reinforced concrete
        body: |
          The lignin wraps around the cellulose fibrils, much like concrete
          around steel rebar.
        position: right

  - type: text
    align: center
    heading: From drawing to object
    body: |
      Each scale was also modelled in 3D, so the structures could leave the
      page as prints you can hold.

  - type: gallery
    columns: 3
    images:
