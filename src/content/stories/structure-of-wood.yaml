project: StructureOfWood
title: Structure of Wood
subtitle: Visualisations & 3D prints of what makes wood work
year: "2019"
client: ETH Zürich, Wood Materials Science
role: Illustration, 3D
tools: ZBrush, Keyshot, Adobe Suite
summary: >-
  Stability, lightness and durability make wood a natural miracle material.
  This series looks inside the trunk, cell by cell, to show where those
  properties come from.
draft: false

blocks:
  - type: hero
    kicker: BA Diploma · 2019
    image:
      src: /src/assets/projects/structureofwood/StructureofWood_Gallery_1_ytvxjm.webp
      alt: Cross-section illustration of a spruce trunk showing bark, cambium and growth rings

  - type: text
    align: center
    body: |
      Wood is stable, light and astonishingly durable. None of that is an
      accident: every property comes from a structure, and every structure
      sits inside a larger one. The series walks from the whole trunk down to
      a single cell wall.

  - type: sticky
    image:
      src: /src/assets/projects/structureofwood/StructureofWood_Gallery_2_rgmaqy.webp
      alt: Layered illustration of wood tissue from trunk to cell wall
    steps:
      - heading: The trunk
        body: |
          Growth rings record every season. Early wood grows fast and wide,
          late wood slow and dense, and that rhythm alone decides how a plank
          will bend.
      - heading: The tissue
        body: |
          Tracheids, long hollow cells, line up along the grain and carry water
          upwards. Rays run across them and hold the structure together
          sideways.
      - heading: The cell wall
        body: |
          Inside each wall, cellulose fibrils wind around the cell at an
          angle. The steeper the angle, the stiffer the wood.

  - type: split
    imageSide: left
    heading: From drawing to object
    image:
      src: /src/assets/projects/structureofwood/StructureofWood_Gallery_3_s5mqz0.webp
      alt: 3D printed model of a wood cell structure
    body: |
      The illustrations were modelled in ZBrush so they could also leave the
      page. A set of 3D prints turns the microscopic cell geometry into
      something you can hold, scaled up around ten thousand times.

